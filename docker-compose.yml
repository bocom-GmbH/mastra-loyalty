# Single Mastra container serving both API and Studio UI.
# Traefik Basic Auth protects the whole host (UI + API).
#
# To call the API from a client, send:
#   Authorization: Basic <base64(user:password)>
#
# STUDIO_BASIC_AUTH = output of `htpasswd -nbB admin 'password'`.
# Paste the raw output in the Coolify env panel (single $, Coolify escapes it).
#
# Network `coolify` is the shared external network where the Coolify-managed
# Postgres lives — joining it lets DNS resolve the DB by its UUID hostname.

services:
  mastra:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4111
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "4111"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4111/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.http.middlewares.mastra-auth.basicauth.users=${STUDIO_BASIC_AUTH}"
      - "traefik.http.routers.mastra.middlewares=mastra-auth@docker"

networks:
  coolify:
    external: true
