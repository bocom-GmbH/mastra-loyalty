# Single Mastra container serving both API and Studio UI.
#
# Routing (domain, TLS, Host rule) is generated automatically by Coolify
# from the "Domains" tab — do not declare Traefik routers/services here.
#
# Basic Auth is attached to the router Coolify generated. Its name is
# derived from the Coolify resource UUID; if the UUID changes (resource
# recreated), update the router name in the middlewares label below.
# Find the current name on the host with:
#   docker inspect <container> --format '{{json .Config.Labels}}' | jq | grep routers
#
# The Basic Auth htpasswd hash is inlined here with every $ doubled to
# $$ — that's how Docker Compose escapes a literal $. Generate a new one
# with `htpasswd -nbB admin 'senha'` and double the dollar signs before
# pasting. Coolify env vars are NOT interpolated into Traefik labels in
# this setup, which is why the value is inlined instead of referenced.
#
# Network `coolify` is the shared external network where the Coolify-managed
# Postgres lives — joining it lets DNS resolve the DB by its UUID hostname.

services:
  mastra:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4111
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "4111"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4111/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    labels:
      - "traefik.http.middlewares.mastra-auth.basicauth.users=admin:$$2y$$05$$76yVNDZ3AinkC6zhTnp3Iu5TPSslJlketySdAQQPp5UTjHvZWhCOW"
      - "traefik.http.routers.https-0-d4o4ww8ockg8c0kgw0sggskc-mastra.middlewares=gzip,mastra-auth"

networks:
  coolify:
    external: true
