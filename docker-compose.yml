# Two identical Mastra containers — same image, different Traefik routing.
#
# - mastra:  API publicly accessible at https://mastra-api.levelling.app
# - studio:  same image, exposes the Studio UI at https://mastra-studio.levelling.app
#            and is protected by HTTP Basic Auth via a Traefik middleware.
#
# Both connect to the same Postgres (DATABASE_URL). The `coolify` external
# network is what Coolify-managed databases and Traefik are attached to;
# joining it lets us resolve the DB by its UUID hostname.
#
# STUDIO_BASIC_AUTH format: "user:$$apr1$$..." (htpasswd output).
# In the Coolify UI, paste the raw htpasswd output (single $); only double the
# $ if you ever hand-edit this file outside Coolify.

services:
  mastra:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4111
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "4111"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4111/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mastra
    environment:
      NODE_ENV: production
      PORT: 4111
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "4111"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4111/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.http.middlewares.studio-auth.basicauth.users=${STUDIO_BASIC_AUTH}"
      - "traefik.http.routers.studio.middlewares=studio-auth@docker"

networks:
  coolify:
    external: true
